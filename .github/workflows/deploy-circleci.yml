name: Setup CircleCI Context and Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.circleci/config.yml'
  workflow_dispatch:

jobs:
  setup-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: Install CircleCI CLI
        run: |
          curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | sudo env VERSION=0.1.38646 bash
          circleci version

      - name: Setup CircleCI CLI
        run: |
          circleci setup --no-prompt --host=https://circleci.com --token=${{ secrets.CIRCLECI_TOKEN }}

      - name: Check and Delete CircleCI Context
        env:
          ORG: ${{ secrets.CIRCLECI_ORG_ID }}
        run: |
          # circleci-cli >=0.1.38646: --org-id 已废弃，改为 --org；list 用 --name 过滤
          if [ -z "$ORG" ]; then echo "CIRCLECI_ORG_ID 未配置"; exit 1; fi
          if circleci context list --org "$ORG" | grep -q "checkincontext"; then
            circleci context delete checkincontext --org "$ORG" --force
          else
            echo "Context does not exist, skipping deletion"
          fi

      - name: Create CircleCI Context
        env:
          ORG: ${{ secrets.CIRCLECI_ORG_ID }}
        run: |
          circleci context create checkincontext --org "$ORG"

      - name: Migrate Secrets to CircleCI Context
        env:
          ORG: ${{ secrets.CIRCLECI_ORG_ID }}
        run: |
          # 新版: circleci context secret set <ctx> --name NAME --value VALUE --org ORG
          # 值由 env 传入，不写进命令行历史/日志；空值跳过
          store_secret() {
            local secret_name=$1
            local secret_value=$2

            if [ -n "$secret_value" ]; then
              echo "Storing secret: $secret_name"
              circleci context secret set checkincontext --name "$secret_name" --value "$secret_value" --org "$ORG"
            else
              echo "Skipping $secret_name: secret is empty or not set"
            fi
          }

          # List of secrets to migrate
          store_secret "TELEGRAM_TOKEN" "${{ secrets.TELEGRAM_TOKEN }}"
          store_secret "TELEGRAM_CHAT_ID" "${{ secrets.TELEGRAM_CHAT_ID }}"
          store_secret "NODESEEK_COOKIE" "${{ secrets.NODESEEK_COOKIE }}"
          store_secret "V2EX_COOKIE" "${{ secrets.V2EX_COOKIE }}"
          store_secret "ONEPOINT3ACRES_COOKIE" "${{ secrets.ONEPOINT3ACRES_COOKIE }}"
          store_secret "TWOCAPTCHA_APIKEY" "${{ secrets.TWOCAPTCHA_APIKEY }}"
          store_secret "DEEPFLOOD_COOKIE" "${{ secrets.DEEPFLOOD_COOKIE }}"
          store_secret "SAKURAFRP_USERNAME" "${{ secrets.SAKURAFRP_USERNAME }}"
          store_secret "SAKURAFRP_PASSWORD" "${{ secrets.SAKURAFRP_PASSWORD }}"
          store_secret "SAKURAFRP_MIMO_APIKEY" "${{ secrets.SAKURAFRP_MIMO_APIKEY }}"
